<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Telegram Web App</title>

    <!-- Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- TON Connect UI -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: var(--tg-theme-bg-color, #f2f2f2);
            color: var(--tg-theme-text-color, #222);
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
        }

        .card {
            background: var(--tg-theme-secondary-bg-color, #ffffff);
            border-radius: 18px;
            padding: 24px;
            margin-bottom: 15px;
        }

        .profile {
            text-align: center;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            display: none;
            margin: 0 auto 15px;
        }

        .name {
            font-size: 24px;
            font-weight: bold;
            margin: 5px 0;
        }

        .username {
            color: #888;
            margin-bottom: 20px;
        }

        .info {
            text-align: left;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(128,128,128,0.15);
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            color: #888;
        }

        .value {
            font-weight: 500;
            text-align: right;
            word-break: break-all;
        }

        h3 {
            margin-top: 0;
        }

        #ton-connect {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .wallet-info {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(128,128,128,0.1);
            display: none;
        }

        .wallet-address {
            font-size: 13px;
            word-break: break-all;
            margin-top: 8px;
        }

        .status {
            margin-top: 12px;
            font-size: 14px;
            color: #777;
        }

        /* ======= БАЛАНС ======= */
        .balance-box {
            margin-top: 12px;
            padding: 12px 14px;
            border-radius: 12px;
            background: rgba(0, 136, 204, 0.08);
            border: 1px solid rgba(0, 136, 204, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .balance-box .label {
            color: #888;
            font-size: 14px;
        }

        .balance-box .value {
            font-size: 18px;
            font-weight: 700;
            color: var(--tg-theme-button-color, #0088cc);
        }

        .balance-box .sub {
            font-size: 11px;
            color: #888;
            font-weight: 400;
            display: block;
            margin-top: 2px;
        }

        .balance-refresh {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            color: #888;
            margin-left: 8px;
        }

        .balance-refresh:active {
            transform: scale(0.9);
        }

        /* ======= ОПЛАТА ======= */
        .payment-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(128,128,128,0.15);
        }

        .payment-section > .label {
            margin-bottom: 8px;
            font-size: 14px;
        }

        .payment-input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(128,128,128,0.2);
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #222);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .payment-input:focus {
            border-color: var(--tg-theme-button-color, #0088cc);
        }

        .pay-btn {
            width: 100%;
            margin-top: 12px;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #fff);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .pay-btn:active {
            transform: scale(0.98);
        }

        .pay-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .payment-section a {
            word-break: break-all;
        }

        #transactionStatus {
            margin-top: 12px;
            font-size: 14px;
            min-height: 20px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Telegram profile -->
    <div class="card profile">

        <img id="avatar" class="avatar">

        <div id="name" class="name">
            Загрузка...
        </div>

        <div id="username" class="username">
            @username
        </div>

        <div class="info">

            <div class="row">
                <span class="label">Telegram ID</span>
                <span id="userId" class="value">—</span>
            </div>

            <div class="row">
                <span class="label">Язык</span>
                <span id="language" class="value">—</span>
            </div>

            <div class="row">
                <span class="label">Premium</span>
                <span id="premium" class="value">—</span>
            </div>

        </div>

    </div>


    <!-- TON Wallet -->
    <div class="card">

        <h3>💎 TON Wallet</h3>

        <div id="ton-connect"></div>

        <div id="walletInfo" class="wallet-info">

            <div>
                <strong>Кошелёк подключён</strong>
            </div>

            <div class="wallet-address" id="walletAddress">
                —
            </div>

            <!-- БАЛАНС -->
            <div class="balance-box">
                <div>
                    <span class="label">Баланс</span>
                    <div class="value" id="walletBalance">
                        ...
                    </div>
                    <span class="sub" id="walletBalanceNano"></span>
                </div>
                <button class="balance-refresh" id="refreshBalance" title="Обновить">
                    🔄
                </button>
            </div>

            <!-- ОПЛАТА -->
            <div class="payment-section">
                <div class="label">Адрес получателя</div>
                <input 
                    type="text" 
                    id="recipientAddress" 
                    class="payment-input" 
                    placeholder="UQ..."
                    autocomplete="off"
                >

                <button id="payBtn" class="pay-btn">
                    Оплатить 0.0001 TON
                </button>

                <div class="status" id="transactionStatus"></div>
            </div>

            <div class="status" id="walletStatus">
                Подключено
            </div>

        </div>

    </div>

</div>


<script>

    /* ==========================================
       TELEGRAM
    ========================================== */

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe?.user;

    if (user) {

        const fullName = [
            user.first_name,
            user.last_name
        ]
        .filter(Boolean)
        .join(" ");

        document.getElementById("name").textContent =
            fullName || "Пользователь Telegram";


        document.getElementById("username").textContent =
            user.username
                ? "@" + user.username
                : "Username отсутствует";


        document.getElementById("userId").textContent =
            user.id;


        document.getElementById("language").textContent =
            user.language_code || "не указан";


        document.getElementById("premium").textContent =
            user.is_premium ? "Да" : "Нет";


        if (user.photo_url) {

            const avatar =
                document.getElementById("avatar");

            avatar.src = user.photo_url;
            avatar.style.display = "block";
        }

    } else {

        document.getElementById("name").textContent =
            "Откройте приложение через Telegram";

        document.getElementById("username").textContent =
            "";
    }


    /* ==========================================
       TON CONNECT
    ========================================== */

    const tonConnectUI =
        new TON_CONNECT_UI.TonConnectUI({

            manifestUrl:
                "https://severivax.github.io/memorygalaxy-privacy/tonconnect-manifest.json",

            buttonRootId:
                "ton-connect",

            restoreConnection:
                true
        });


    tonConnectUI.uiOptions = {
        language: "ru"
    };


    /* ==========================================
       ПОЛУЧЕНИЕ БАЛАНСА
    ========================================== */

    async function fetchBalance(address) {
        const balanceEl = document.getElementById("walletBalance");
        const nanoEl    = document.getElementById("walletBalanceNano");

        balanceEl.textContent = "...";
        nanoEl.textContent    = "";

        try {
            const res = await fetch(
                `https://tonapi.io/v2/accounts/${address}`
            );

            if (!res.ok) throw new Error("Ошибка API: " + res.status);

            const data = await res.json();

            const nano = BigInt(data.balance);
            const ton  = Number(nano) / 1e9;

            const formatted = ton.toLocaleString("ru-RU", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 6
            });

            balanceEl.textContent = `💎 ${formatted} TON`;
            nanoEl.textContent    = `${nano.toLocaleString("ru-RU")} нано-TON`;

        } catch (err) {
            console.error("Не удалось получить баланс:", err);
            balanceEl.textContent = "Ошибка";
            nanoEl.textContent    = "не удалось загрузить";
        }
    }


    /* ==========================================
       ОТПРАВКА ПЛАТЕЖА
    ========================================== */

    async function sendPayment() {
        const recipientInput = document.getElementById("recipientAddress");
        const statusEl       = document.getElementById("transactionStatus");
        const btn            = document.getElementById("payBtn");

        const recipient = recipientInput.value.trim();

        // Валидация
        if (!recipient) {
            statusEl.textContent = "❌ Укажите адрес получателя";
            statusEl.style.color = "#e74c3c";
            return;
        }

        if (!currentAddress) {
            statusEl.textContent = "❌ Сначала подключите кошелёк";
            statusEl.style.color = "#e74c3c";
            return;
        }

        // Блокируем кнопку
        btn.disabled    = true;
        btn.textContent = "⏳ Отправка...";
        statusEl.textContent = "Подтвердите транзакцию в кошельке...";
        statusEl.style.color = "#0088cc";

        try {
            // 0.0001 TON = 100000 нано-TON
            const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 60,
                messages: [
                    {
                        address: recipient,
                        amount: "100000"
                    }
                ]
            };

            const result = await tonConnectUI.sendTransaction(transaction);

            // Успех
            const txHash = result.boc
                ? JSON.parse(
                    atob(
                        result.boc.split(":")[0] || ""
                    )
                ).hash || ""
                : "";

            statusEl.innerHTML =
                `✅ Транзакция отправлена!<br>` +
                `<a href="https://tonviewer.com/transaction/${result.boc}" target="_blank" style="color: #0088cc;">` +
                `Посмотреть в tonviewer</a>`;
            statusEl.style.color = "#27ae60";

            // Обновляем баланс через 5 секунд
            setTimeout(() => {
                if (currentAddress) fetchBalance(currentAddress);
            }, 5000);

        } catch (err) {
            console.error("Ошибка транзакции:", err);

            if (
                err.message &&
                (
                    err.message.includes("reject") ||
                    err.message.includes("Reject")
                )
            ) {
                statusEl.textContent = "❌ Транзакция отклонена пользователем";
            } else {
                statusEl.textContent = "❌ Ошибка: " + (err.message || "неизвестная");
            }
            statusEl.style.color = "#e74c3c";
        } finally {
            btn.disabled    = false;
            btn.textContent = "Оплатить 0.0001 TON";
        }
    }


    /* ==========================================
       СОСТОЯНИЕ КОШЕЛЬКА
    ========================================== */

    let currentAddress = null;

    tonConnectUI.onStatusChange(wallet => {

        const walletInfo    = document.getElementById("walletInfo");
        const walletAddress = document.getElementById("walletAddress");
        const walletStatus  = document.getElementById("walletStatus");


        if (wallet) {

            walletInfo.style.display = "block";
            currentAddress = wallet.account.address;

            walletAddress.textContent = wallet.account.address;

            let walletName = "TON Wallet";
            if (wallet.device && wallet.device.appName) {
                walletName = wallet.device.appName;
            }

            walletStatus.textContent = "Подключено через " + walletName;

            fetchBalance(currentAddress);

        } else {

            walletInfo.style.display = "none";
            currentAddress = null;

        }

    });


    /* ==========================================
       ОБРАБОТЧИКИ
    ========================================== */

    document.getElementById("refreshBalance")
        .addEventListener("click", () => {
            if (currentAddress) {
                fetchBalance(currentAddress);
            }
        });

    document.getElementById("payBtn")
        .addEventListener("click", sendPayment);

    /* Отправка по Enter */
    document.getElementById("recipientAddress")
        .addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                sendPayment();
            }
        });

</script>

</body>
</html>
