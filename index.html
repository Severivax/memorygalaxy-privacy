<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram User</title>

    <!-- Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 20px;
        }

        .user {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
        }

        .info {
            text-align: left;
            margin-top: 20px;
        }

        .row {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .label {
            color: #777;
        }
    </style>
</head>

<body>

<div class="user">

    <img id="avatar" class="avatar" style="display:none;">

    <h2 id="name">Загрузка...</h2>

    <div class="info">

        <div class="row">
            <span class="label">Username:</span>
            <span id="username">—</span>
        </div>

        <div class="row">
            <span class="label">Telegram ID:</span>
            <span id="userId">—</span>
        </div>

        <div class="row">
            <span class="label">Язык:</span>
            <span id="language">—</span>
        </div>

        <div class="row">
            <span class="label">Premium:</span>
            <span id="premium">—</span>
        </div>

    </div>
</div>

<script>

    // Инициализация Telegram Web App
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    // Получаем данные пользователя
    const user = tg.initDataUnsafe.user;

    if (user) {

        // Имя + фамилия
        const fullName = [
            user.first_name,
            user.last_name
        ].filter(Boolean).join(" ");

        document.getElementById("name").textContent =
            fullName || "Пользователь Telegram";

        // Username
        document.getElementById("username").textContent =
            user.username ? "@" + user.username : "нет";

        // Telegram ID
        document.getElementById("userId").textContent =
            user.id;

        // Язык
        document.getElementById("language").textContent =
            user.language_code || "не указан";

        // Premium
        document.getElementById("premium").textContent =
            user.is_premium ? "Да" : "Нет";

        // Фото профиля
        if (user.photo_url) {

            const avatar = document.getElementById("avatar");

            avatar.src = user.photo_url;
            avatar.style.display = "block";
        }

    } else {

        document.getElementById("name").textContent =
            "Откройте приложение через Telegram";

    }

</script>

</body>
</html>
