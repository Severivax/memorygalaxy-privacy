<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Telegram Web App</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: var(--tg-theme-bg-color, #f2f2f2);
            color: var(--tg-theme-text-color, #222);
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
        }

        .card {
            background: var(--tg-theme-secondary-bg-color, #ffffff);
            border-radius: 18px;
            padding: 24px;
            margin-bottom: 15px;
        }

        .profile { text-align: center; }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            display: none;
            margin: 0 auto 15px;
        }

        .name { font-size: 24px; font-weight: bold; margin: 5px 0; }
        .username { color: #888; margin-bottom: 20px; }
        .info { text-align: left; }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(128,128,128,0.15);
        }

        .row:last-child { border-bottom: none; }
        .label { color: #888; }
        .value { font-weight: 500; text-align: right; word-break: break-all; }

        h3 { margin-top: 0; }

        #ton-connect {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .wallet-info {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(128,128,128,0.1);
            display: none;
        }

        .wallet-address {
            font-size: 13px;
            word-break: break-all;
            margin-top: 8px;
        }

        .status {
            margin-top: 12px;
            font-size: 14px;
            color: #777;
        }

        .balance-box {
            margin-top: 12px;
            padding: 12px 14px;
            border-radius: 12px;
            background: rgba(0, 136, 204, 0.08);
            border: 1px solid rgba(0, 136, 204, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .balance-box .label { color: #888; font-size: 14px; }

        .balance-box .value {
            font-size: 18px;
            font-weight: 700;
            color: var(--tg-theme-button-color, #0088cc);
        }

        .balance-box .sub {
            font-size: 11px;
            color: #888;
            font-weight: 400;
            display: block;
            margin-top: 2px;
        }

        .balance-refresh {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            color: #888;
            margin-left: 8px;
        }

        .payment-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(128,128,128,0.15);
        }

        .payment-section > .label {
            margin-bottom: 8px;
            font-size: 14px;
        }

        .payment-input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(128,128,128,0.2);
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #222);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .payment-input:focus {
            border-color: var(--tg-theme-button-color, #0088cc);
        }

        .network-info {
            margin-top: 8px;
            font-size: 12px;
            color: #888;
        }

        .network-info .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 4px;
        }

        .badge-mainnet { background: #d4f5e9; color: #27ae60; }
        .badge-testnet { background: #fdecea; color: #e74c3c; }

        .testnet-warning {
            margin-top: 10px;
            padding: 12px 14px;
            border-radius: 10px;
            background: #fdecea;
            border: 1px solid #e74c3c;
            color: #c0392b;
            font-size: 13px;
            display: none;
        }

        .pay-btn {
            width: 100%;
            margin-top: 12px;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #fff);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .pay-btn:active { transform: scale(0.98); }
        .pay-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        #transactionStatus {
            margin-top: 12px;
            font-size: 14px;
            min-height: 20px;
            line-height: 1.5;
            word-break: break-word;
        }

        #transactionStatus a {
            color: var(--tg-theme-button-color, #0088cc);
        }

        .debug-log {
            margin-top: 10px;
            padding: 8px;
            border-radius: 8px;
            background: rgba(0,0,0,0.05);
            font-size: 11px;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 120px;
            overflow-y: auto;
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card profile">
        <img id="avatar" class="avatar">
        <div id="name" class="name">Загрузка...</div>
        <div id="username" class="username">@username</div>
        <div class="info">
            <div class="row">
                <span class="label">Telegram ID</span>
                <span id="userId" class="value">—</span>
            </div>
            <div class="row">
                <span class="label">Язык</span>
                <span id="language" class="value">—</span>
            </div>
            <div class="row">
                <span class="label">Premium</span>
                <span id="premium" class="value">—</span>
            </div>
        </div>
    </div>

    <div class="card">
        <h3>💎 TON Wallet</h3>
        <div id="ton-connect"></div>

        <div id="walletInfo" class="wallet-info">
            <div><strong>Кошелёк подключён</strong></div>
            <div class="wallet-address" id="walletAddress">—</div>

            <!-- ПРЕДУПРЕЖДЕНИЕ О ТЕСТНЕТЕ -->
            <div class="testnet-warning" id="testnetWarning">
                ⚠️ Кошелёк подключён в <b>testnet</b>.<br>
                Оплата реальными TON недоступна.<br>
                Переключите кошелёк на <b>mainnet</b> в настройках.
            </div>

            <div class="balance-box">
                <div>
                    <span class="label">Баланс</span>
                    <div class="value" id="walletBalance">...</div>
                    <span class="sub" id="walletBalanceNano"></span>
                </div>
                <button class="balance-refresh" id="refreshBalance" title="Обновить">🔄</button>
            </div>

            <div class="payment-section">
                <div class="label">Адрес получателя</div>
                <input 
                    type="text" 
                    id="recipientAddress" 
                    class="payment-input" 
                    placeholder="UQ... или EQ..."
                    autocomplete="off"
                    spellcheck="false"
                >

                <div class="network-info">
                    Сеть кошелька: <span class="badge" id="networkBadge">—</span>
                </div>

                <button id="payBtn" class="pay-btn">
                    Оплатить 0.0001 TON
                </button>

                <div id="transactionStatus"></div>
                <div id="debugLog" class="debug-log"></div>
            </div>

            <div class="status" id="walletStatus">Подключено</div>
        </div>
    </div>

</div>


<script>

    /* ==========================================
       TELEGRAM
    ========================================== */

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe?.user;

    if (user) {
        const fullName = [user.first_name, user.last_name].filter(Boolean).join(" ");
        document.getElementById("name").textContent = fullName || "Пользователь Telegram";
        document.getElementById("username").textContent = user.username ? "@" + user.username : "Username отсутствует";
        document.getElementById("userId").textContent = user.id;
        document.getElementById("language").textContent = user.language_code || "не указан";
        document.getElementById("premium").textContent = user.is_premium ? "Да" : "Нет";

        if (user.photo_url) {
            const avatar = document.getElementById("avatar");
            avatar.src = user.photo_url;
            avatar.style.display = "block";
        }
    } else {
        document.getElementById("name").textContent = "Откройте приложение через Telegram";
        document.getElementById("username").textContent = "";
    }


    /* ==========================================
       TON CONNECT (только MAINNET)
    ========================================== */

    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: "https://severivax.github.io/memorygalaxy-privacy/tonconnect-manifest.json",
        buttonRootId: "ton-connect",
        restoreConnection: true
    });

    tonConnectUI.uiOptions = { language: "ru" };


    /* ==========================================
       ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    ========================================== */

    function logDebug(text) {
        const el = document.getElementById("debugLog");
        el.style.display = "block";
        el.textContent = text;
        console.log("[DEBUG]", text);
    }

    function showTxStatus(message, color) {
        const el = document.getElementById("transactionStatus");
        el.innerHTML = message;
        el.style.color = color;
    }

    /* Валидация адреса только для MAINNET */
    function isValidMainnetAddress(address) {
        if (!address) return false;
        const trimmed = address.trim();

        // User-friendly mainnet: 48 символов, начинается на UQ или EQ
        if (/^(UQ|EQ)[A-Za-z0-9\-_]{46}$/.test(trimmed)) return true;

        // Raw mainnet: 0:hex (64 hex-символа)
        if (/^0:[0-9a-fA-F]{64}$/.test(trimmed)) return true;

        return false;
    }


    /* ==========================================
       ПОЛУЧЕНИЕ БАЛАНСА (только MAINNET)
    ========================================== */

    async function fetchBalance(address) {
        const balanceEl = document.getElementById("walletBalance");
        const nanoEl    = document.getElementById("walletBalanceNano");

        balanceEl.textContent = "...";
        nanoEl.textContent    = "";

        try {
            const res = await fetch(`https://tonapi.io/v2/accounts/${address}`);

            if (!res.ok) throw new Error("Ошибка API: " + res.status);

            const data = await res.json();
            const nano = BigInt(data.balance);
            const ton  = Number(nano) / 1e9;

            const formatted = ton.toLocaleString("ru-RU", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 6
            });

            balanceEl.textContent = `💎 ${formatted} TON`;
            nanoEl.textContent    = `${nano.toLocaleString("ru-RU")} нано-TON`;

        } catch (err) {
            console.error("Не удалось получить баланс:", err);
            balanceEl.textContent = "Ошибка";
            nanoEl.textContent    = "не удалось загрузить";
        }
    }


    /* ==========================================
       ОТПРАВКА ПЛАТЕЖА (только MAINNET)
    ========================================== */

    async function sendPayment() {
        const recipientInput = document.getElementById("recipientAddress");
        const btn            = document.getElementById("payBtn");

        const recipient = recipientInput.value.trim();

        // 1. Проверка подключения
        if (!currentAddress || !tonConnectUI.connected) {
            showTxStatus("❌ Сначала подключите кошелёк", "#e74c3c");
            return;
        }

        // 2. Проверка сети кошелька — только mainnet
        if (currentWallet?.account?.chain === "testnet") {
            showTxStatus(
                "❌ Кошелёк в testnet. Переключитесь на mainnet.",
                "#e74c3c"
            );
            return;
        }

        // 3. Валидация адреса — только mainnet
        if (!recipient) {
            showTxStatus("❌ Укажите адрес получателя", "#e74c3c");
            return;
        }

        if (!isValidMainnetAddress(recipient)) {
            showTxStatus(
                "❌ Неверный адрес для mainnet.<br>Адрес должен начинаться на <b>UQ</b> или <b>EQ</b> (48 символов).",
                "#e74c3c"
            );
            return;
        }

        // 4. Блокируем кнопку
        btn.disabled    = true;
        btn.textContent = "⏳ Отправка...";
        showTxStatus("Подтвердите транзакцию в кошельке...", "#0088cc");
        logDebug(`Sending 100000 нано-TON → ${recipient}`);

        try {
            const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 300,
                messages: [
                    {
                        address: recipient,
                        amount: "100000"  // 0.0001 TON
                    }
                ]
            };

            logDebug("Вызов sendTransaction...");
            const result = await tonConnectUI.sendTransaction(transaction);
            logDebug("Успех! BOC: " + (result?.boc?.slice(0, 40) || "нет"));

            showTxStatus(
                `✅ Транзакция отправлена!<br>` +
                `<a href="https://tonviewer.com/transaction/${result.boc}" target="_blank">` +
                `Посмотреть в tonviewer ↗</a>`,
                "#27ae60"
            );

            setTimeout(() => {
                if (currentAddress) fetchBalance(currentAddress);
            }, 5000);

        } catch (err) {
            console.error("Ошибка транзакции:", err);
            logDebug(
                `name: ${err.name}\n` +
                `message: ${err.message}\n` +
                `cause: ${err.cause || "—"}\n` +
                `code: ${err.code || "—"}`
            );

            let message = "❌ Транзакция не отправлена";
            let color   = "#e74c3c";

            if (err.message?.toLowerCase().includes("reject")) {
                message = "❌ Отменено пользователем";
            } else if (err.message?.toLowerCase().includes("insufficient")) {
                message = "❌ Недостаточно средств на кошельке";
            } else if (err.message?.toLowerCase().includes("expired")) {
                message = "❌ Истекло время ожидания";
            } else if (err.message) {
                message = `❌ ${err.message}`;
            }

            showTxStatus(message, color);

        } finally {
            btn.disabled    = false;
            btn.textContent = "Оплатить 0.0001 TON";
        }
    }


    /* ==========================================
       СОСТОЯНИЕ КОШЕЛЬКА
    ========================================== */

    let currentAddress = null;
    let currentWallet  = null;

    tonConnectUI.onStatusChange(wallet => {
        const walletInfo      = document.getElementById("walletInfo");
        const walletAddress   = document.getElementById("walletAddress");
        const walletStatus    = document.getElementById("walletStatus");
        const networkBadge    = document.getElementById("networkBadge");
        const testnetWarning  = document.getElementById("testnetWarning");
        const payBtn          = document.getElementById("payBtn");
        const debugEl         = document.getElementById("debugLog");

        debugEl.style.display = "none";

        if (wallet) {
            currentWallet  = wallet;
            currentAddress = wallet.account.address;

            walletInfo.style.display = "block";
            walletAddress.textContent = currentAddress;

            const isTestnet = wallet.account.chain === "testnet";

            // Показываем бейдж сети
            networkBadge.textContent = isTestnet ? "TESTNET" : "MAINNET";
            networkBadge.className   = "badge " + (isTestnet ? "badge-testnet" : "badge-mainnet");

            // Если тестнет — показываем предупреждение и блокируем оплату
            if (isTestnet) {
                testnetWarning.style.display = "block";
                payBtn.disabled = true;
                payBtn.textContent = "Оплата недоступна (тестнет)";
            } else {
                testnetWarning.style.display = "none";
                payBtn.disabled = false;
                payBtn.textContent = "Оплатить 0.0001 TON";
            }

            let walletName = "TON Wallet";
            if (wallet.device?.appName) walletName = wallet.device.appName;
            walletStatus.textContent = "Подключено через " + walletName;

            // Баланс всегда с mainnet (tonapi.io)
            fetchBalance(currentAddress);

        } else {
            walletInfo.style.display = "none";
            currentAddress = null;
            currentWallet  = null;
        }
    });


    /* ==========================================
       ОБРАБОТЧИКИ
    ========================================== */

    document.getElementById("refreshBalance")
        .addEventListener("click", () => {
            if (currentAddress) fetchBalance(currentAddress);
        });

    document.getElementById("payBtn")
        .addEventListener("click", sendPayment);

    document.getElementById("recipientAddress")
        .addEventListener("keydown", (e) => {
            if (e.key === "Enter") sendPayment();
        });

</script>

</body>
</html>
